[project]
name = "digital-leo"
version = "0.1.0"
description = "Person-NER for the Tolstoy Digital TEI corpus — rule-based vs. LLM"
requires-python = ">=3.11"
dependencies = [
    "lxml>=5.2",
    "pandas>=2.2",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "langfuse>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-xdist>=3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digital_leo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
