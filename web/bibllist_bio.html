<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>bibllist_bio — Tolstoy Digital</title>
<style>
  :root {
    --bg: #f6f4ee;
    --panel: #fffdf7;
    --ink: #1f1b16;
    --muted: #6b645a;
    --line: #e2dccc;
    --accent: #7a3b1f;
    --accent-soft: #f0e2d5;
    --selected: #efe5d2;
    --chip: #ece6d7;
    --chip-on: #7a3b1f;
    --chip-on-ink: #fffdf7;
    --shadow: 0 1px 0 rgba(0,0,0,.04), 0 12px 32px rgba(60,40,15,.06);
    --serif: "Iowan Old Style", "Charter", "Georgia", "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", system-ui, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.45;
    display: grid;
    grid-template-rows: auto 1fr;
  }
  header {
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    padding: 10px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  header h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 18px;
    margin: 0;
    letter-spacing: .01em;
  }
  header .subtitle {
    color: var(--muted);
    font-size: 12px;
  }
  header .nav {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
  }
  header .nav a {
    color: var(--accent);
    text-decoration: none;
    padding: 3px 8px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: #fff;
  }
  header .nav a:hover { border-color: var(--accent); background: var(--accent-soft); }
  header .spacer { flex: 1; }
  main {
    display: grid;
    grid-template-columns: minmax(340px, 460px) 1fr;
    overflow: hidden;
    min-height: 0;
  }
  #left {
    border-right: 1px solid var(--line);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  #search-wrap {
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
  }
  #search {
    width: 100%;
    border: 1px solid var(--line);
    background: #fff;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 14px;
    color: var(--ink);
  }
  #search:focus,
  .year-row input:focus {
    outline: 2px solid var(--accent-soft);
    border-color: var(--accent);
  }
  #counter {
    margin-top: 6px;
    font-size: 12px;
    color: var(--muted);
  }
  #filters {
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    max-height: 34vh;
    overflow-y: auto;
  }
  #filters details { margin-bottom: 4px; }
  #filters summary {
    cursor: pointer;
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .06em;
    padding: 4px 0;
    user-select: none;
  }
  #filters .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 4px 0 8px;
  }
  .chip {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 12px;
    background: var(--chip);
    color: var(--ink);
    font-size: 12px;
    cursor: pointer;
    user-select: none;
    border: 1px solid transparent;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.on {
    background: var(--chip-on);
    color: var(--chip-on-ink);
  }
  .year-row {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 6px;
    padding: 4px 0 8px;
  }
  .year-row input {
    width: 100%;
    border: 1px solid var(--line);
    background: #fff;
    padding: 5px 7px;
    border-radius: 4px;
    font-size: 12px;
    color: var(--ink);
  }
  .year-row button {
    border: 1px solid var(--line);
    background: #fff;
    color: var(--accent);
    border-radius: 4px;
    padding: 5px 9px;
    cursor: pointer;
    font-size: 12px;
  }
  .year-row button:hover { border-color: var(--accent); background: var(--accent-soft); }
  #list {
    overflow-y: auto;
    flex: 1;
    min-height: 0;
  }
  .row {
    padding: 8px 14px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .row:hover { background: var(--accent-soft); }
  .row.selected { background: var(--selected); }
  .row .name {
    font-family: var(--serif);
    font-size: 15px;
  }
  .row .meta {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
  #right {
    overflow-y: auto;
    padding: 28px 36px 60px;
    background: var(--bg);
  }
  #right.empty {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
  }
  .card {
    max-width: 880px;
    margin: 0 auto;
  }
  .card h2 {
    font-family: var(--serif);
    font-size: 26px;
    margin: 0 0 8px;
    line-height: 1.15;
  }
  .meta-line {
    color: var(--muted);
    font-size: 13px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .meta-line code {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink);
  }
  .source-title {
    margin-top: 12px;
    color: var(--muted);
    font-size: 13px;
  }
  .source-title strong { color: var(--ink); font-weight: 600; }
  .section {
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
  }
  .section h3 {
    font-family: var(--serif);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
    font-weight: 600;
    margin: 0 0 10px;
  }
  .section p {
    margin: 0 0 8px;
    font-size: 15px;
    line-height: 1.55;
  }
  .bibl {
    font-family: var(--serif);
    font-size: 16px;
    line-height: 1.55;
  }
  .opener {
    font-family: var(--serif);
    font-size: 17px;
    line-height: 1.55;
  }
  .group { margin-bottom: 12px; }
  .group .glabel {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .05em;
    margin-bottom: 5px;
  }
  .group .badges,
  .badges {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  .badge {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 12px;
    background: var(--chip);
    font-size: 12px;
    color: var(--ink);
    text-decoration: none;
  }
  a.badge {
    color: var(--accent);
    background: #fff;
    border: 1px solid var(--line);
  }
  a.badge:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  #drop {
    margin: 60px auto;
    max-width: 520px;
    padding: 28px;
    border: 2px dashed var(--line);
    border-radius: 10px;
    background: var(--panel);
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }
  #drop.over {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--ink);
  }
  #drop .pick { margin-top: 14px; }
  #drop input[type=file] { font-size: 12px; }
  .err {
    color: #8a2a14;
    background: #fbeee7;
    border: 1px solid #e9bfae;
    padding: 10px 14px;
    border-radius: 6px;
    margin: 16px;
    font-size: 13px;
  }
  kbd {
    background: var(--chip);
    border-radius: 3px;
    padding: 1px 5px;
    font-family: var(--mono);
    font-size: 11px;
  }
  @media (max-width: 780px) {
    main { grid-template-columns: 1fr; }
    #left {
      border-right: none;
      border-bottom: 1px solid var(--line);
      max-height: 54vh;
    }
    #right { padding: 22px 18px 48px; }
  }
</style>
</head>
<body>
<header>
  <h1>bibllist_bio</h1>
  <span class="subtitle" id="status">загрузка…</span>
  <nav class="nav" aria-label="Справочники">
    <a href="persons.html">personList</a>
  </nav>
  <span class="spacer"></span>
</header>
<main>
  <aside id="left">
    <div id="search-wrap">
      <input id="search" type="search" placeholder="Поиск по id, заголовку, дате, цитате, relation…  (нажмите /)" autocomplete="off">
      <div id="counter">—</div>
    </div>
    <div id="filters">
      <details open>
        <summary>Годы</summary>
        <div class="year-row">
          <input id="year-from" inputmode="numeric" placeholder="от" aria-label="Год от">
          <input id="year-to" inputmode="numeric" placeholder="до" aria-label="Год до">
          <button id="year-clear" type="button">сброс</button>
        </div>
      </details>
      <div id="filter-groups"></div>
    </div>
    <div id="list"></div>
  </aside>
  <section id="right" class="empty">
    <div id="detail"><span>Выберите запись из списка слева</span></div>
  </section>
</main>

<script>
"use strict";

const TEI_NS = "http://www.tei-c.org/ns/1.0";
const XML_NS = "http://www.w3.org/XML/1998/namespace";

const BIBL_LIST_URL = "../vendor/TEI/reference/bibllist_bio.xml";
const TAXONOMY_URL = "../vendor/TEI/reference/taxonomy.xml";
const PERSON_LIST_URL = "../vendor/TEI/reference/personList.xml";
const MAX_ROWS = 700;

const RELATION_LABELS = {
  person: "Персоны",
  works: "Произведения",
  location: "Места",
  texts: "Тексты",
  source: "Источники",
};

const state = {
  sources: [],
  records: [],
  byId: new Map(),
  taxonomy: new Map(),
  personIds: new Set(),
  activeId: null,
  filters: new Set(),
  query: "",
  yearFrom: null,
  yearTo: null,
  visible: [],
  rendered: [],
};

const $ = (sel) => document.querySelector(sel);

function setStatus(msg) { $("#status").textContent = msg; }

function showError(msg) {
  const right = $("#right");
  right.classList.remove("empty");
  right.innerHTML = `<div class="err">${msg}</div>`;
}

function tx(el) {
  if (!el) return "";
  return (el.textContent || "").replace(/\s+/g, " ").trim();
}

function directChildren(el, name) {
  return Array.from(el.children).filter(child => child.localName === name);
}

function firstDirect(el, name) {
  return directChildren(el, name)[0] || null;
}

function directTitle(el, type) {
  const title = directChildren(el, "title").find(t => (t.getAttribute("type") || "") === type);
  return tx(title);
}

function xmlId(el) {
  if (!el) return "";
  return el.getAttributeNS(XML_NS, "id") || el.getAttribute("xml:id") || el.getAttribute("id") || "";
}

function stripHash(value) {
  value = value || "";
  return value.startsWith("#") ? value.slice(1) : value;
}

function parseTaxonomy(xmlString) {
  const map = new Map();
  if (!xmlString) return map;
  const doc = new DOMParser().parseFromString(xmlString, "application/xml");
  if (doc.getElementsByTagName("parsererror").length) return map;
  for (const cat of doc.getElementsByTagName("category")) {
    const id = cat.getAttribute("xml:id");
    if (!id) continue;
    let label = "";
    for (const child of cat.children) {
      if (child.localName === "catDesc") {
        label = tx(child);
        break;
      }
    }
    map.set(id, { target: cat.getAttribute("target") || "", label: label || id });
  }
  return map;
}

function parsePersonIds(xmlString) {
  const ids = new Set();
  if (!xmlString) return ids;
  const doc = new DOMParser().parseFromString(xmlString, "application/xml");
  if (doc.getElementsByTagName("parsererror").length) return ids;
  for (const person of doc.getElementsByTagNameNS(TEI_NS, "person")) {
    const id = person.getAttribute("id") || person.getAttributeNS(XML_NS, "id");
    if (id) ids.add(id);
  }
  return ids;
}

function parseCategories(el) {
  const categories = [];
  for (const cr of directChildren(el, "catRef")) {
    const ana = stripHash(cr.getAttribute("ana"));
    if (!ana) continue;
    categories.push({ target: cr.getAttribute("target") || "", ana });
  }
  return categories;
}

function parseDate(relatedItem) {
  const dates = directChildren(relatedItem, "date");
  const machine = dates.find(d => d.hasAttribute("from") || d.hasAttribute("to")) || null;
  const editor = dates.find(d => d.getAttribute("type") === "editor") || null;
  const from = machine ? (machine.getAttribute("from") || "") : "";
  const to = machine ? (machine.getAttribute("to") || "") : "";
  const yearStart = yearFromDate(from || to);
  const yearEnd = yearFromDate(to || from);
  return {
    from,
    to,
    period: machine ? (machine.getAttribute("period") || "") : "",
    cert: machine ? (machine.getAttribute("cert") || "") : "",
    calendar: machine ? (machine.getAttribute("calendar") || "") : "",
    editor: tx(editor),
    yearStart,
    yearEnd,
  };
}

function yearFromDate(value) {
  const m = /^-?\d{1,4}/.exec(value || "");
  return m ? Number(m[0]) : null;
}

function parseRelations(relatedItem) {
  const groups = new Map();
  for (const rel of directChildren(relatedItem, "relation")) {
    const ref = rel.getAttribute("ref") || "";
    if (!ref || ref === "EMPTY") continue;
    const type = rel.getAttribute("type") || "relation";
    if (!groups.has(type)) groups.set(type, []);
    groups.get(type).push(ref);
  }
  const out = {};
  for (const [type, refs] of groups.entries()) {
    out[type] = Array.from(new Set(refs));
  }
  return out;
}

function relationRefs(relations) {
  const refs = [];
  for (const values of Object.values(relations)) refs.push(...values);
  return refs;
}

function parseBiblBio(xmlString) {
  const doc = new DOMParser().parseFromString(xmlString, "application/xml");
  if (doc.getElementsByTagName("parsererror").length) {
    throw new Error("bibllist_bio.xml: parse error");
  }

  const bodyList = doc.getElementsByTagNameNS(TEI_NS, "list")[0];
  if (!bodyList) throw new Error("bibllist_bio.xml: list not found");

  const sources = [];
  const records = [];
  for (const item of directChildren(bodyList, "item")) {
    const sourceRef = firstDirect(item, "ref");
    const source = {
      id: xmlId(sourceRef),
      title: directTitle(item, "main") || tx(firstDirect(item, "title")),
      categories: parseCategories(item),
      count: 0,
    };
    sources.push(source);

    for (const related of directChildren(item, "relatedItem")) {
      const ref = firstDirect(related, "ref");
      const id = xmlId(ref);
      if (!id) continue;
      const date = parseDate(related);
      const categories = parseCategories(related);
      const relations = parseRelations(related);
      const record = {
        id,
        source,
        biodataTitle: directTitle(related, "biodata"),
        mainTitle: directTitle(related, "main"),
        biblTitle: directTitle(related, "bibl"),
        date,
        categories,
        relations,
        opener: tx(firstDirect(related, "opener")),
      };
      record._haystack = searchHaystack(record);
      records.push(record);
      source.count += 1;
    }
  }
  return { sources, records };
}

function searchHaystack(record) {
  const parts = [
    record.id,
    record.source.id,
    record.source.title,
    record.biodataTitle,
    record.mainTitle,
    record.biblTitle,
    record.date.from,
    record.date.to,
    record.date.editor,
    record.opener,
  ];
  for (const c of record.source.categories) parts.push(c.ana, c.target);
  for (const c of record.categories) parts.push(c.ana, c.target);
  parts.push(...relationRefs(record.relations));
  return parts.join(" ").toLowerCase();
}

function compareRecords(a, b) {
  const ay = a.date.yearStart ?? 9999;
  const by = b.date.yearStart ?? 9999;
  return ay - by || a.id.localeCompare(b.id, "ru");
}

function sourceCategoryLabel(ana) {
  const tax = state.taxonomy.get(ana);
  return tax ? tax.label : ana;
}

function buildFilters() {
  const wrap = $("#filter-groups");
  wrap.innerHTML = "";

  const sourceDetails = document.createElement("details");
  sourceDetails.open = true;
  sourceDetails.innerHTML = `<summary>Источники</summary><div class="chips"></div>`;
  const sourceChips = sourceDetails.querySelector(".chips");
  for (const source of state.sources) {
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.dataset.key = `source:${source.id}`;
    chip.textContent = `${source.title || source.id} · ${source.count.toLocaleString("ru-RU")}`;
    chip.title = source.id;
    chip.addEventListener("click", () => toggleFilter(chip.dataset.key, chip));
    sourceChips.appendChild(chip);
  }
  wrap.appendChild(sourceDetails);

  const categoryCounts = new Map();
  for (const source of state.sources) {
    for (const c of source.categories) {
      categoryCounts.set(c.ana, (categoryCounts.get(c.ana) || 0) + source.count);
    }
  }
  if (categoryCounts.size) {
    const catDetails = document.createElement("details");
    catDetails.open = true;
    catDetails.innerHTML = `<summary>Тип источника</summary><div class="chips"></div>`;
    const catChips = catDetails.querySelector(".chips");
    const sorted = Array.from(categoryCounts.entries()).sort((a, b) => b[1] - a[1]);
    for (const [ana, count] of sorted) {
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.dataset.key = `source-category:${ana}`;
      chip.textContent = `${sourceCategoryLabel(ana)} · ${count.toLocaleString("ru-RU")}`;
      chip.title = ana;
      chip.addEventListener("click", () => toggleFilter(chip.dataset.key, chip));
      catChips.appendChild(chip);
    }
    wrap.appendChild(catDetails);
  }
}

function toggleFilter(key, chip) {
  if (state.filters.has(key)) {
    state.filters.delete(key);
    chip.classList.remove("on");
  } else {
    state.filters.add(key);
    chip.classList.add("on");
  }
  applyFilters();
}

function parseYearInput(value) {
  const m = /^\s*(-?\d{1,4})\s*$/.exec(value || "");
  return m ? Number(m[1]) : null;
}

function matchesFilters(record) {
  if (!state.filters.size && state.yearFrom === null && state.yearTo === null) return true;

  for (const filter of state.filters) {
    const [kind, value] = filter.split(":");
    if (kind === "source" && record.source.id !== value) return false;
    if (kind === "source-category" && !record.source.categories.some(c => c.ana === value)) return false;
  }

  if (state.yearFrom !== null || state.yearTo !== null) {
    const start = record.date.yearStart;
    const end = record.date.yearEnd ?? start;
    if (start === null || end === null) return false;
    if (state.yearFrom !== null && end < state.yearFrom) return false;
    if (state.yearTo !== null && start > state.yearTo) return false;
  }
  return true;
}

function applyFilters() {
  const q = state.query.trim().toLowerCase();
  const visible = [];
  for (const record of state.records) {
    if (q && !record._haystack.includes(q)) continue;
    if (!matchesFilters(record)) continue;
    visible.push(record);
  }
  state.visible = visible;
  renderList();
  const shown = visible.length.toLocaleString("ru-RU");
  const total = state.records.length.toLocaleString("ru-RU");
  const rendered = Math.min(visible.length, MAX_ROWS).toLocaleString("ru-RU");
  const cap = visible.length > MAX_ROWS ? `, показаны первые ${rendered}; уточните поиск` : "";
  $("#counter").textContent = `Найдено ${shown} из ${total}${cap}`;
}

function renderList() {
  const list = $("#list");
  list.innerHTML = "";
  state.rendered = state.visible.slice(0, MAX_ROWS);
  const frag = document.createDocumentFragment();
  for (const record of state.rendered) {
    const row = document.createElement("div");
    row.className = "row";
    row.dataset.id = record.id;
    if (record.id === state.activeId) row.classList.add("selected");
    row.innerHTML = `<div class="name"></div><div class="meta"></div>`;
    row.firstChild.textContent = record.biodataTitle || record.mainTitle || record.id;
    row.lastChild.textContent = listMeta(record);
    row.addEventListener("click", () => selectRecord(record.id, true));
    frag.appendChild(row);
  }
  list.appendChild(frag);
}

function listMeta(record) {
  const date = record.date.editor || dateRange(record.date);
  const bits = [];
  if (date) bits.push(date);
  bits.push(record.source.title || record.source.id);
  bits.push(record.id);
  return bits.join(" · ");
}

function dateRange(date) {
  if (date.from && date.to && date.from !== date.to) return `${date.from} — ${date.to}`;
  return date.from || date.to || "";
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function renderCategories(categories) {
  if (!categories.length) return "";
  const badges = categories.map(c => {
    const label = sourceCategoryLabel(c.ana);
    const title = c.target ? `${c.target}:${c.ana}` : c.ana;
    return `<span class="badge" title="${escapeHtml(title)}">${escapeHtml(label)}</span>`;
  }).join("");
  return `<div class="badges">${badges}</div>`;
}

function renderRelations(relations) {
  const types = Object.keys(relations).sort((a, b) => {
    const order = ["person", "works", "location", "texts", "source"];
    const ai = order.indexOf(a), bi = order.indexOf(b);
    return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi) || a.localeCompare(b);
  });
  if (!types.length) return "";
  let html = "";
  for (const type of types) {
    const label = RELATION_LABELS[type] || type;
    const badges = relations[type].map(ref => {
      if (type === "person" && state.personIds.has(ref)) {
        return `<a class="badge" href="persons.html#id=${encodeURIComponent(ref)}">person ${escapeHtml(ref)}</a>`;
      }
      return `<span class="badge">${escapeHtml(ref)}</span>`;
    }).join("");
    html += `<div class="group"><div class="glabel">${escapeHtml(label)}</div><div class="badges">${badges}</div></div>`;
  }
  return html;
}

function renderDetail(record) {
  const right = $("#right");
  right.classList.remove("empty");
  if (!record) {
    right.classList.add("empty");
    right.innerHTML = `<div id="detail"><span>Не найдено</span></div>`;
    return;
  }

  const machineDate = dateRange(record.date);
  const dateBits = [
    record.date.editor ? `ред. ${record.date.editor}` : null,
    machineDate ? `TEI ${machineDate}` : null,
    record.date.period ? `period ${record.date.period}` : null,
    record.date.cert ? `cert ${record.date.cert}` : null,
  ].filter(Boolean);

  const sourceCats = renderCategories(record.source.categories);
  const recordCats = renderCategories(record.categories);
  const relations = renderRelations(record.relations);

  right.innerHTML = `
    <article class="card">
      <h2>${escapeHtml(record.biodataTitle || record.mainTitle || record.id)}</h2>
      <div class="meta-line">
        <span>id <code>${escapeHtml(record.id)}</code></span>
        ${dateBits.map(bit => `<span>${escapeHtml(bit)}</span>`).join("")}
      </div>
      <div class="source-title">
        Источник: <strong>${escapeHtml(record.source.title || record.source.id)}</strong>
        <span>(${escapeHtml(record.source.id)})</span>
      </div>
      ${record.mainTitle ? `<div class="section"><h3>Заголовок</h3><p>${escapeHtml(record.mainTitle)}</p></div>` : ""}
      ${record.biblTitle ? `<div class="section"><h3>Библиография</h3><p class="bibl">${escapeHtml(record.biblTitle)}</p></div>` : ""}
      ${record.opener ? `<div class="section"><h3>Opener</h3><p class="opener">${escapeHtml(record.opener)}</p></div>` : ""}
      ${relations ? `<div class="section"><h3>Связи</h3>${relations}</div>` : ""}
      ${recordCats ? `<div class="section"><h3>Категории записи</h3>${recordCats}</div>` : ""}
      ${sourceCats ? `<div class="section"><h3>Категории источника</h3>${sourceCats}</div>` : ""}
    </article>
  `;
}

function markSelectedRow() {
  for (const row of document.querySelectorAll(".row.selected")) row.classList.remove("selected");
  const row = Array.from(document.querySelectorAll(".row")).find(el => el.dataset.id === state.activeId);
  if (row) {
    row.classList.add("selected");
    row.scrollIntoView({ block: "nearest" });
  }
}

function selectRecord(id, updateHash) {
  const record = state.byId.get(id);
  state.activeId = id;
  renderDetail(record);
  markSelectedRow();
  if (updateHash) {
    const newHash = `#entry=${encodeURIComponent(id)}`;
    if (location.hash !== newHash) history.replaceState(null, "", newHash);
  }
}

function selectFromHash() {
  const m = /^#entry=(.+)$/.exec(location.hash);
  if (m) selectRecord(decodeURIComponent(m[1]), false);
}

function moveSelection(dir) {
  const visible = state.rendered;
  if (!visible.length) return;
  let idx = visible.findIndex(record => record.id === state.activeId);
  if (idx < 0) idx = dir > 0 ? -1 : visible.length;
  idx = Math.max(0, Math.min(visible.length - 1, idx + dir));
  selectRecord(visible[idx].id, true);
}

function debounce(fn, ms) {
  let t;
  return (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), ms);
  };
}

function wireSearch() {
  const input = $("#search");
  const onChange = debounce(() => {
    state.query = input.value;
    applyFilters();
  }, 100);
  input.addEventListener("input", onChange);

  document.addEventListener("keydown", (e) => {
    if (e.target === input) {
      if (e.key === "ArrowDown") { e.preventDefault(); moveSelection(1); }
      else if (e.key === "ArrowUp") { e.preventDefault(); moveSelection(-1); }
      return;
    }
    if (e.key === "/" && !e.ctrlKey && !e.metaKey && !e.altKey) {
      e.preventDefault();
      input.focus();
      input.select();
    } else if (e.key === "ArrowDown") {
      e.preventDefault();
      moveSelection(1);
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      moveSelection(-1);
    }
  });
}

function wireYearFilters() {
  const from = $("#year-from");
  const to = $("#year-to");
  const onChange = debounce(() => {
    state.yearFrom = parseYearInput(from.value);
    state.yearTo = parseYearInput(to.value);
    applyFilters();
  }, 150);
  from.addEventListener("input", onChange);
  to.addEventListener("input", onChange);
  $("#year-clear").addEventListener("click", () => {
    from.value = "";
    to.value = "";
    state.yearFrom = null;
    state.yearTo = null;
    applyFilters();
  });
}

async function bootFromFetch() {
  const bioXml = await fetch(BIBL_LIST_URL).then(r => {
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.text();
  });
  const taxonomyXml = await fetch(TAXONOMY_URL).then(r => r.ok ? r.text() : "").catch(() => "");
  const personListXml = await fetch(PERSON_LIST_URL).then(r => r.ok ? r.text() : "").catch(() => "");
  finishBoot(bioXml, taxonomyXml, personListXml);
}

function finishBoot(bioXml, taxonomyXml, personListXml) {
  state.taxonomy = parseTaxonomy(taxonomyXml);
  state.personIds = parsePersonIds(personListXml);
  const parsed = parseBiblBio(bioXml);
  state.sources = parsed.sources;
  state.records = parsed.records.sort(compareRecords);
  state.byId = new Map(state.records.map(record => [record.id, record]));
  buildFilters();
  applyFilters();
  setStatus(`загружено ${state.sources.length.toLocaleString("ru-RU")} источников, ${state.records.length.toLocaleString("ru-RU")} записей`);
  selectFromHash();
  window.addEventListener("hashchange", selectFromHash);
}

function showDropFallback(reason) {
  setStatus("файл не найден через fetch");
  const right = $("#right");
  right.classList.remove("empty");
  right.innerHTML = `
    <div id="drop">
      <div><strong>Не удалось загрузить XML по сети.</strong></div>
      <div style="margin-top:6px;">${escapeHtml(reason || "")}</div>
      <div style="margin-top:14px;">
        Перетащите сюда <code>bibllist_bio.xml</code>, а также при желании <code>taxonomy.xml</code> и <code>personList.xml</code>,<br>
        или выберите XML-файлы:
      </div>
      <div class="pick">
        <input id="picker" type="file" accept=".xml" multiple>
      </div>
      <div style="margin-top:14px; font-size:12px;">
        Подсказка: запустите <kbd>python3 -m http.server</kbd> в корне проекта,
        откройте <kbd>http://localhost:8000/web/bibllist_bio.html</kbd> — и драг-н-дроп не понадобится.
      </div>
    </div>
  `;
  const drop = document.getElementById("drop");
  drop.addEventListener("dragover", (e) => {
    e.preventDefault();
    drop.classList.add("over");
  });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", (e) => {
    e.preventDefault();
    drop.classList.remove("over");
    handleFiles(e.dataTransfer.files);
  });
  document.getElementById("picker").addEventListener("change", (e) => handleFiles(e.target.files));
}

async function handleFiles(fileList) {
  const files = Array.from(fileList || []);
  let bioXml = null;
  let taxonomyXml = "";
  let personListXml = "";
  for (const file of files) {
    const text = await file.text();
    const lower = file.name.toLowerCase();
    if (lower.includes("taxonomy")) taxonomyXml = text;
    else if (lower.includes("bibllist_bio") || /<relatedItem[\s>]/.test(text)) bioXml = text;
    else if (lower.includes("personlist") || /<listPerson|<person\s/.test(text)) personListXml = text;
  }
  if (!bioXml) {
    showError("Нужен файл bibllist_bio.xml");
    return;
  }
  try {
    finishBoot(bioXml, taxonomyXml, personListXml);
    const right = document.getElementById("right");
    right.classList.add("empty");
    right.innerHTML = `<div id="detail"><span>Выберите запись из списка слева</span></div>`;
  } catch (err) {
    showError("Ошибка разбора XML: " + escapeHtml(err.message || String(err)));
  }
}

(async function init() {
  wireSearch();
  wireYearFilters();
  try {
    await bootFromFetch();
  } catch (err) {
    showDropFallback(err && err.message ? err.message : String(err));
  }
})();
</script>

</html>
