<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>personList — Tolstoy Digital</title>
<style>
  :root {
    --bg: #f6f4ee;
    --panel: #fffdf7;
    --ink: #1f1b16;
    --muted: #6b645a;
    --line: #e2dccc;
    --accent: #7a3b1f;
    --accent-soft: #f0e2d5;
    --selected: #efe5d2;
    --chip: #ece6d7;
    --chip-on: #7a3b1f;
    --chip-on-ink: #fffdf7;
    --shadow: 0 1px 0 rgba(0,0,0,.04), 0 12px 32px rgba(60,40,15,.06);
    --serif: "Iowan Old Style", "Charter", "Georgia", "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.45;
    display: grid;
    grid-template-rows: auto 1fr;
  }
  header {
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    padding: 10px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  header h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 18px;
    margin: 0;
    letter-spacing: .01em;
  }
  header .subtitle {
    color: var(--muted);
    font-size: 12px;
  }
  header .nav {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
  }
  header .nav a {
    color: var(--accent);
    text-decoration: none;
    padding: 3px 8px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: #fff;
  }
  header .nav a:hover { border-color: var(--accent); background: var(--accent-soft); }
  header .spacer { flex: 1; }
  header .imgbase {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--muted);
  }
  header .imgbase input {
    width: 220px;
    border: 1px solid var(--line);
    background: #fff;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 12px;
    color: var(--ink);
  }
  main {
    display: grid;
    grid-template-columns: minmax(320px, 420px) 1fr;
    overflow: hidden;
    min-height: 0;
  }
  #left {
    border-right: 1px solid var(--line);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  #search-wrap {
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
  }
  #search {
    width: 100%;
    border: 1px solid var(--line);
    background: #fff;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 14px;
    color: var(--ink);
  }
  #search:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  #counter {
    margin-top: 6px;
    font-size: 12px;
    color: var(--muted);
  }
  #filters {
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    max-height: 30vh;
    overflow-y: auto;
  }
  #filters details {
    margin-bottom: 4px;
  }
  #filters summary {
    cursor: pointer;
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .06em;
    padding: 4px 0;
    user-select: none;
  }
  #filters .chips {
    display: flex; flex-wrap: wrap; gap: 4px;
    padding: 4px 0 8px;
  }
  .chip {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 12px;
    background: var(--chip);
    color: var(--ink);
    font-size: 12px;
    cursor: pointer;
    user-select: none;
    border: 1px solid transparent;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.on {
    background: var(--chip-on);
    color: var(--chip-on-ink);
  }
  #list {
    overflow-y: auto;
    flex: 1;
    min-height: 0;
  }
  .row {
    padding: 8px 14px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .row.hidden { display: none; }
  .row:hover { background: var(--accent-soft); }
  .row.selected { background: var(--selected); }
  .row .name {
    font-family: var(--serif);
    font-size: 15px;
  }
  .row .meta {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
  #right {
    overflow-y: auto;
    padding: 28px 36px 60px;
    background: var(--bg);
  }
  #right.empty { display: flex; align-items: center; justify-content: center; color: var(--muted); }
  .card {
    max-width: 760px;
    margin: 0 auto;
  }
  .card .top {
    display: grid;
    grid-template-columns: 140px 1fr;
    gap: 24px;
    align-items: start;
  }
  .card .photo {
    width: 140px;
    height: 180px;
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 6px;
    object-fit: cover;
    box-shadow: var(--shadow);
  }
  .card h2 {
    font-family: var(--serif);
    font-size: 26px;
    margin: 0 0 4px;
    line-height: 1.15;
  }
  .card .latin { color: var(--muted); font-style: italic; font-size: 15px; }
  .card .dates {
    margin-top: 10px;
    color: var(--muted);
    font-size: 13px;
  }
  .card .ids {
    margin-top: 10px;
    font-size: 12px;
    color: var(--muted);
    display: flex; flex-wrap: wrap; gap: 14px;
  }
  .card .ids a { color: var(--accent); text-decoration: none; }
  .card .ids a:hover { text-decoration: underline; }
  .section {
    margin-top: 26px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
  }
  .section h3 {
    font-family: var(--serif);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
    font-weight: 600;
    margin: 0 0 10px;
  }
  .section p { margin: 0 0 8px; font-size: 15px; line-height: 1.55; }
  .group { margin-bottom: 10px; }
  .group .glabel { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
  .group .badges { display: flex; flex-wrap: wrap; gap: 5px; }
  .badge {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 12px;
    background: var(--chip);
    font-size: 12px;
    color: var(--ink);
  }
  .name-list { display: flex; flex-direction: column; gap: 2px; }
  .name-list .nrow { font-size: 14px; }
  .name-list .ntype { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; margin-right: 6px; }
  #drop {
    margin: 60px auto;
    max-width: 480px;
    padding: 28px;
    border: 2px dashed var(--line);
    border-radius: 10px;
    background: var(--panel);
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }
  #drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
  #drop .pick { margin-top: 14px; }
  #drop input[type=file] {
    font-size: 12px;
  }
  .err {
    color: #8a2a14;
    background: #fbeee7;
    border: 1px solid #e9bfae;
    padding: 10px 14px;
    border-radius: 6px;
    margin: 16px;
    font-size: 13px;
  }
  kbd {
    background: var(--chip);
    border-radius: 3px;
    padding: 1px 5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
  }
  @media (max-width: 720px) {
    main { grid-template-columns: 1fr; }
    #left { border-right: none; border-bottom: 1px solid var(--line); max-height: 50vh; }
    .card .top { grid-template-columns: 100px 1fr; gap: 14px; }
    .card .photo { width: 100px; height: 130px; }
  }
</style>
</head>
<body>
<header>
  <h1>personList</h1>
  <span class="subtitle" id="status">загрузка…</span>
  <nav class="nav" aria-label="Справочники">
    <a href="bibllist_bio.html">bibllist_bio</a>
  </nav>
  <span class="spacer"></span>
  <label class="imgbase" title="Префикс для путей вида /storage/app/media/Persons/15.png">
    Источник изображений:
    <input id="imgbase" type="text" value="https://tolstoy.ru" spellcheck="false">
  </label>
</header>
<main>
  <aside id="left">
    <div id="search-wrap">
      <input id="search" type="search" placeholder="Поиск по имени или id…  (нажмите /)" autocomplete="off">
      <div id="counter">—</div>
    </div>
    <div id="filters"></div>
    <div id="list"></div>
  </aside>
  <section id="right" class="empty">
    <div id="detail"><span>Выберите человека из списка слева</span></div>
  </section>
</main>

<script>
"use strict";

const TEI_NS = "http://www.tei-c.org/ns/1.0";
const XML_NS = "http://www.w3.org/XML/1998/namespace";

const PERSON_LIST_URL = "../vendor/TEI/reference/personList.xml";
const TAXONOMY_URL    = "../vendor/TEI/reference/taxonomy.xml";

const PLACEHOLDER_SVG = "data:image/svg+xml;utf8," + encodeURIComponent(
  `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 130' width='100' height='130'>
     <rect width='100' height='130' fill='#efe9d8'/>
     <circle cx='50' cy='48' r='20' fill='#cfc6ad'/>
     <path d='M14 130 C14 96 36 80 50 80 C64 80 86 96 86 130 Z' fill='#cfc6ad'/>
   </svg>`
);

const FILTER_GROUPS = [
  { target: "time",          label: "Эпоха" },
  { target: "country",       label: "Происхождение" },
  { target: "occupation",    label: "Род занятий" },
  { target: "correspondent", label: "Корреспондент" },
  { target: "family",        label: "Семья" },
];

const state = {
  persons: [],
  taxonomy: new Map(),  // ana id -> {target, label}
  filtered: [],
  activeId: null,
  filters: new Set(),   // strings "target:ana"
  query: "",
};

const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => Array.from(document.querySelectorAll(sel));

function setStatus(msg) { $("#status").textContent = msg; }

function showError(msg) {
  const right = $("#right");
  right.classList.remove("empty");
  right.innerHTML = `<div class="err">${msg}</div>`;
}

function tx(el) {
  if (!el) return "";
  return (el.textContent || "").replace(/\s+/g, " ").trim();
}

function ownText(el) {
  if (!el) return "";
  let s = "";
  for (const node of el.childNodes) {
    if (node.nodeType === 3) s += node.nodeValue;
  }
  return s.replace(/\s+/g, " ").trim();
}

function parseTaxonomy(xmlString) {
  const doc = new DOMParser().parseFromString(xmlString, "application/xml");
  if (doc.getElementsByTagName("parsererror").length) {
    throw new Error("taxonomy.xml: parse error");
  }
  const map = new Map();
  for (const cat of doc.getElementsByTagName("category")) {
    const id = cat.getAttribute("xml:id");
    const target = cat.getAttribute("target") || "";
    if (!id) continue;
    let label = "";
    for (const child of cat.children) {
      if (child.localName === "catDesc") { label = tx(child); break; }
    }
    map.set(id, { target, label: label || id });
  }
  return map;
}

function parsePersons(xmlString) {
  const doc = new DOMParser().parseFromString(xmlString, "application/xml");
  if (doc.getElementsByTagName("parsererror").length) {
    throw new Error("personList.xml: parse error");
  }
  const out = [];
  const persons = doc.getElementsByTagNameNS(TEI_NS, "person");
  for (const p of persons) {
    const id = p.getAttribute("id") || p.getAttributeNS(XML_NS, "id");
    if (!id) continue;
    const persNames = Array.from(p.getElementsByTagNameNS(TEI_NS, "persName"));
    const main = persNames.find(e => e.getAttribute("type") === "main") || persNames[0];
    const latinEl = persNames.find(e => e.getAttribute("type") === "latin");

    const lead = main ? ownText(main) : "";
    const forenames = [];
    let patronym = null;
    if (main) {
      for (const f of main.getElementsByTagNameNS(TEI_NS, "forename")) {
        const t = tx(f);
        if (!t) continue;
        if (f.getAttribute("type") === "patronym") patronym = t;
        else forenames.push(t);
      }
    }

    const variants = [];
    for (const pn of persNames) {
      if (pn === main) continue;
      const t = tx(pn);
      if (t) variants.push({ type: pn.getAttribute("type") || "", text: t });
    }

    let born = null, died = null, lifePeriod = null;
    for (const ev of p.getElementsByTagNameNS(TEI_NS, "event")) {
      const type = ev.getAttribute("type");
      const when = ev.getAttribute("when");
      if (type === "born" && when) born = when;
      else if (type === "died" && when) died = when;
      else if (type === "life_period") {
        const t = tx(ev);
        if (t) lifePeriod = t;
      }
    }

    let description = "", description2 = "", comment90v = "";
    for (const note of p.getElementsByTagNameNS(TEI_NS, "note")) {
      const t = note.getAttribute("type");
      const txt = tx(note);
      if (!txt) continue;
      if (t === "description") description = txt;
      else if (t === "description2") description2 = txt;
      else if (t === "90v_comment") comment90v = txt;
    }

    const categories = [];
    for (const cr of p.getElementsByTagNameNS(TEI_NS, "catRef")) {
      const target = cr.getAttribute("target") || "";
      let ana = cr.getAttribute("ana") || "";
      if (ana.startsWith("#")) ana = ana.slice(1);
      if (ana) categories.push({ target, ana });
    }

    const imageEl = p.getElementsByTagNameNS(TEI_NS, "image")[0];
    const imageUrl = imageEl ? (imageEl.getAttribute("url") || "") : "";

    let wikidata = null;
    if (main) {
      const ref = main.getAttribute("ref") || "";
      if (/^Q\d+$/.test(ref)) wikidata = ref;
    }

    out.push({
      id,
      mainName: lead,
      latinName: latinEl ? tx(latinEl) : "",
      forenames, patronym,
      variants,
      born, died, lifePeriod,
      description, description2, comment90v,
      categories,
      imageUrl,
      wikidata,
    });
  }
  return out;
}

function searchHaystack(p) {
  const parts = [p.mainName, p.latinName, p.id];
  for (const v of p.variants) parts.push(v.text);
  for (const f of p.forenames) parts.push(f);
  if (p.patronym) parts.push(p.patronym);
  return parts.join(" ").toLowerCase();
}

function compareByName(a, b) {
  return (a.mainName || "").localeCompare(b.mainName || "", "ru");
}

function lifeShort(p) {
  if (p.lifePeriod) return p.lifePeriod;
  if (p.born && p.died) return `${p.born.slice(0,4)}–${p.died.slice(0,4)}`;
  if (p.born) return `${p.born.slice(0,4)}–`;
  if (p.died) return `–${p.died.slice(0,4)}`;
  return "";
}

function buildList() {
  const list = $("#list");
  list.innerHTML = "";
  const frag = document.createDocumentFragment();
  for (const p of state.persons) {
    p._haystack = searchHaystack(p);
    const div = document.createElement("div");
    div.className = "row";
    div.dataset.id = p.id;
    const life = lifeShort(p);
    div.innerHTML = `<div class="name"></div><div class="meta"></div>`;
    div.firstChild.textContent = p.mainName || `(без имени, id=${p.id})`;
    div.lastChild.textContent = life ? `${life} · id ${p.id}` : `id ${p.id}`;
    div.addEventListener("click", () => selectPerson(p.id, true));
    p._row = div;
    frag.appendChild(div);
  }
  list.appendChild(frag);
}

function buildFilters() {
  const wrap = $("#filters");
  wrap.innerHTML = "";

  const targetCounts = new Map();  // target -> Map(ana -> count)
  for (const p of state.persons) {
    for (const c of p.categories) {
      if (!targetCounts.has(c.target)) targetCounts.set(c.target, new Map());
      const m = targetCounts.get(c.target);
      m.set(c.ana, (m.get(c.ana) || 0) + 1);
    }
  }

  for (const grp of FILTER_GROUPS) {
    const m = targetCounts.get(grp.target);
    if (!m || m.size === 0) continue;
    const det = document.createElement("details");
    det.open = (grp.target === "occupation" || grp.target === "time" || grp.target === "country");
    const sum = document.createElement("summary");
    sum.textContent = grp.label;
    det.appendChild(sum);
    const chips = document.createElement("div");
    chips.className = "chips";
    const sorted = Array.from(m.entries()).sort((a, b) => b[1] - a[1]);
    for (const [ana, count] of sorted) {
      const tax = state.taxonomy.get(ana);
      const label = tax ? tax.label : ana;
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.dataset.key = `${grp.target}:${ana}`;
      chip.textContent = `${label} · ${count}`;
      chip.title = ana;
      chip.addEventListener("click", () => toggleFilter(chip.dataset.key, chip));
      chips.appendChild(chip);
    }
    det.appendChild(chips);
    wrap.appendChild(det);
  }
}

function toggleFilter(key, chip) {
  if (state.filters.has(key)) {
    state.filters.delete(key);
    chip.classList.remove("on");
  } else {
    state.filters.add(key);
    chip.classList.add("on");
  }
  applyFilters();
}

function matchesFilters(p) {
  if (state.filters.size === 0) return true;
  const have = new Set();
  for (const c of p.categories) have.add(`${c.target}:${c.ana}`);
  // All selected filters must match (AND).
  for (const f of state.filters) if (!have.has(f)) return false;
  return true;
}

function applyFilters() {
  const q = state.query.trim().toLowerCase();
  let shown = 0;
  for (const p of state.persons) {
    let visible = true;
    if (q && !p._haystack.includes(q)) visible = false;
    if (visible && !matchesFilters(p)) visible = false;
    p._row.classList.toggle("hidden", !visible);
    if (visible) shown++;
  }
  state.filtered = shown;
  $("#counter").textContent = `Показано ${shown.toLocaleString("ru-RU")} из ${state.persons.length.toLocaleString("ru-RU")}`;
}

function imgBase() {
  const v = ($("#imgbase").value || "").trim();
  return v.replace(/\/+$/, "");
}

function resolveImageUrl(url) {
  if (!url) return "";
  if (/^https?:\/\//i.test(url)) return url;
  const base = imgBase();
  if (!base) return "";
  if (!url.startsWith("/")) url = "/" + url;
  return base + url;
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function renderDetail(p) {
  const right = $("#right");
  right.classList.remove("empty");
  if (!p) {
    right.classList.add("empty");
    right.innerHTML = `<div id="detail"><span>Не найден</span></div>`;
    return;
  }

  const life = lifeShort(p);
  const bornDied = [
    p.born ? `р. ${p.born}` : null,
    p.died ? `ум. ${p.died}` : null,
  ].filter(Boolean).join(" · ");

  const photoUrl = resolveImageUrl(p.imageUrl);
  const photoTag = photoUrl
    ? `<img class="photo" src="${escapeHtml(photoUrl)}" alt="" loading="lazy" onerror="this.onerror=null;this.src='${PLACEHOLDER_SVG}';">`
    : `<img class="photo" src="${PLACEHOLDER_SVG}" alt="">`;

  const idsParts = [];
  idsParts.push(`id <strong>${escapeHtml(p.id)}</strong>`);
  if (p.wikidata) {
    idsParts.push(`<a href="https://www.wikidata.org/wiki/${escapeHtml(p.wikidata)}" target="_blank" rel="noopener">Wikidata ${escapeHtml(p.wikidata)} ↗</a>`);
  }

  // Names section
  const nameRows = [];
  if (p.mainName) nameRows.push(`<div class="nrow"><span class="ntype">main</span>${escapeHtml(p.mainName)}</div>`);
  if (p.latinName) nameRows.push(`<div class="nrow"><span class="ntype">latin</span>${escapeHtml(p.latinName)}</div>`);
  for (const v of p.variants) {
    if (v.type === "latin") continue;
    nameRows.push(`<div class="nrow"><span class="ntype">${escapeHtml(v.type || "alt")}</span>${escapeHtml(v.text)}</div>`);
  }
  if (p.forenames.length || p.patronym) {
    const parts = [...p.forenames];
    if (p.patronym) parts.push(`${p.patronym} (отчество)`);
    nameRows.push(`<div class="nrow"><span class="ntype">forms</span>${escapeHtml(parts.join(" · "))}</div>`);
  }

  // Categories grouped by target
  const byTarget = new Map();
  for (const c of p.categories) {
    if (!byTarget.has(c.target)) byTarget.set(c.target, []);
    byTarget.get(c.target).push(c);
  }
  const groupOrder = FILTER_GROUPS.map(g => g.target);
  const groupLabels = Object.fromEntries(FILTER_GROUPS.map(g => [g.target, g.label]));
  const sortedTargets = Array.from(byTarget.keys()).sort((a, b) => {
    const ai = groupOrder.indexOf(a), bi = groupOrder.indexOf(b);
    return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi) || a.localeCompare(b);
  });
  let catsHtml = "";
  for (const t of sortedTargets) {
    const cs = byTarget.get(t);
    const label = groupLabels[t] || t;
    const badges = cs.map(c => {
      const tax = state.taxonomy.get(c.ana);
      const txt = tax ? tax.label : c.ana;
      return `<span class="badge" title="${escapeHtml(c.ana)}">${escapeHtml(txt)}</span>`;
    }).join("");
    catsHtml += `<div class="group"><div class="glabel">${escapeHtml(label)}</div><div class="badges">${badges}</div></div>`;
  }

  // Descriptions
  const descBlocks = [];
  if (p.description)  descBlocks.push(`<p>${escapeHtml(p.description)}</p>`);
  if (p.description2) descBlocks.push(`<p>${escapeHtml(p.description2)}</p>`);
  if (p.comment90v)   descBlocks.push(`<p><em>Из комментария к 90-томнику:</em> ${escapeHtml(p.comment90v)}</p>`);

  right.innerHTML = `
    <article class="card">
      <div class="top">
        ${photoTag}
        <div>
          <h2>${escapeHtml(p.mainName || `id ${p.id}`)}</h2>
          ${p.latinName ? `<div class="latin">${escapeHtml(p.latinName)}</div>` : ""}
          ${life || bornDied ? `<div class="dates">${escapeHtml(life)}${life && bornDied ? " · " : ""}${bornDied}</div>` : ""}
          <div class="ids">${idsParts.join(" · ")}</div>
        </div>
      </div>
      ${descBlocks.length ? `<div class="section"><h3>Описание</h3>${descBlocks.join("")}</div>` : ""}
      ${catsHtml ? `<div class="section"><h3>Категории</h3>${catsHtml}</div>` : ""}
      ${nameRows.length ? `<div class="section"><h3>Имена</h3><div class="name-list">${nameRows.join("")}</div></div>` : ""}
    </article>
  `;
}

function selectPerson(id, updateHash) {
  const p = state.persons.find(x => x.id === id);
  if (state.activeId) {
    const prev = state.persons.find(x => x.id === state.activeId);
    if (prev && prev._row) prev._row.classList.remove("selected");
  }
  state.activeId = id;
  if (p && p._row) {
    p._row.classList.add("selected");
    p._row.scrollIntoView({ block: "nearest" });
  }
  renderDetail(p);
  if (updateHash) {
    const newHash = `#id=${encodeURIComponent(id)}`;
    if (location.hash !== newHash) history.replaceState(null, "", newHash);
  }
}

function selectFromHash() {
  const m = /^#id=(.+)$/.exec(location.hash);
  if (m) selectPerson(decodeURIComponent(m[1]), false);
}

function moveSelection(dir) {
  const visible = state.persons.filter(p => !p._row.classList.contains("hidden"));
  if (!visible.length) return;
  let idx = visible.findIndex(p => p.id === state.activeId);
  if (idx < 0) idx = dir > 0 ? -1 : visible.length;
  idx = Math.max(0, Math.min(visible.length - 1, idx + dir));
  selectPerson(visible[idx].id, true);
}

function debounce(fn, ms) {
  let t;
  return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

function wireSearch() {
  const input = $("#search");
  const onChange = debounce(() => {
    state.query = input.value;
    applyFilters();
  }, 100);
  input.addEventListener("input", onChange);

  document.addEventListener("keydown", (e) => {
    if (e.target === input) {
      if (e.key === "ArrowDown") { e.preventDefault(); moveSelection(1); }
      else if (e.key === "ArrowUp") { e.preventDefault(); moveSelection(-1); }
      return;
    }
    if (e.key === "/" && !e.ctrlKey && !e.metaKey && !e.altKey) {
      e.preventDefault();
      input.focus();
      input.select();
    } else if (e.key === "ArrowDown") {
      e.preventDefault(); moveSelection(1);
    } else if (e.key === "ArrowUp") {
      e.preventDefault(); moveSelection(-1);
    }
  });
}

function wireImgBase() {
  $("#imgbase").addEventListener("change", () => {
    if (state.activeId) {
      const p = state.persons.find(x => x.id === state.activeId);
      if (p) renderDetail(p);
    }
  });
}

async function bootFromFetch() {
  const [pl, tx] = await Promise.all([
    fetch(PERSON_LIST_URL).then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.text(); }),
    fetch(TAXONOMY_URL).then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.text(); }),
  ]);
  return finishBoot(pl, tx);
}

function finishBoot(personListXml, taxonomyXml) {
  state.taxonomy = parseTaxonomy(taxonomyXml);
  state.persons = parsePersons(personListXml);
  state.persons.sort(compareByName);
  buildList();
  buildFilters();
  applyFilters();
  setStatus(`загружено ${state.persons.length.toLocaleString("ru-RU")} персон`);
  selectFromHash();
  window.addEventListener("hashchange", selectFromHash);
}

function showDropFallback(reason) {
  setStatus("файл не найден через fetch");
  const right = $("#right");
  right.classList.remove("empty");
  right.innerHTML = `
    <div id="drop">
      <div><strong>Не удалось загрузить XML по сети.</strong></div>
      <div style="margin-top:6px;">${escapeHtml(reason || "")}</div>
      <div style="margin-top:14px;">
        Перетащите сюда <code>personList.xml</code> и <code>taxonomy.xml</code>,<br>
        или выберите оба файла:
      </div>
      <div class="pick">
        <input id="picker" type="file" accept=".xml" multiple>
      </div>
      <div style="margin-top:14px; font-size:12px;">
        Подсказка: запустите <kbd>python3 -m http.server</kbd> в корне проекта,
        откройте <kbd>http://localhost:8000/web/persons.html</kbd> — и драг-н-дроп не понадобится.
      </div>
    </div>
  `;
  const drop = document.getElementById("drop");
  drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", (e) => {
    e.preventDefault();
    drop.classList.remove("over");
    handleFiles(e.dataTransfer.files);
  });
  document.getElementById("picker").addEventListener("change", (e) => handleFiles(e.target.files));
}

async function handleFiles(fileList) {
  const files = Array.from(fileList || []);
  let personListXml = null, taxonomyXml = null;
  for (const f of files) {
    const text = await f.text();
    const lower = f.name.toLowerCase();
    if (lower.includes("taxonomy")) taxonomyXml = text;
    else if (lower.includes("person")) personListXml = text;
    else {
      // Heuristic: peek at content.
      if (/<listPerson|<person\s/.test(text)) personListXml = text;
      else if (/<taxonomy|<category\s/.test(text)) taxonomyXml = text;
    }
  }
  if (!personListXml || !taxonomyXml) {
    showError("Нужны оба файла: personList.xml и taxonomy.xml");
    return;
  }
  try {
    finishBoot(personListXml, taxonomyXml);
    document.getElementById("right").classList.remove("empty");
  } catch (err) {
    showError("Ошибка разбора XML: " + escapeHtml(err.message || String(err)));
  }
}

(async function init() {
  wireSearch();
  wireImgBase();
  try {
    await bootFromFetch();
  } catch (err) {
    showDropFallback(err && err.message ? err.message : String(err));
  }
})();
</script>
